<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系友會電子會員證</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1F1E;
    --deep:#0F3D3E;
    --mid:#2B6E68;
    --paper:#F6F3EC;
    --gold:#C9A24B;
    --alert:#B3432E;
    --line:rgba(15,61,62,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(43,110,104,0.25), transparent 55%),
      linear-gradient(180deg, #0B1F1E 0%, #0F3D3E 55%, #123f3c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
  }

  .stage{ width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; }

  .brand{
    color:rgba(246,243,236,0.75);
    font-size:12px;
    letter-spacing:0.3em;
    margin-bottom:14px;
    text-align:center;
  }
  .brand b{ color:#F6F3EC; letter-spacing:0.1em; }

  /* --- Card --- */
  .card{
    position:relative;
    width:100%;
    background:var(--paper);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .punch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:56px; height:7px; border-radius:6px;
    background:rgba(15,31,30,0.15);
    z-index:5;
  }

  .head{
    background:linear-gradient(135deg, var(--deep), var(--mid));
    padding:34px 22px 46px;
    position:relative;
    color:var(--paper);
  }
  .head::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:26px;
    background:var(--paper);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .assoc{
    font-size:11px; letter-spacing:0.2em; opacity:0.75; margin-bottom:6px;
  }
  .title-row{ display:flex; align-items:center; gap:8px; }
  .cross{
    width:16px; height:16px; position:relative; flex:none;
  }
  .cross::before,.cross::after{
    content:""; position:absolute; background:var(--gold);
  }
  .cross::before{ left:6.5px; top:0; width:3px; height:16px; border-radius:2px;}
  .cross::after{ top:6.5px; left:0; width:16px; height:3px; border-radius:2px;}
  .role{ font-size:13px; font-weight:700; letter-spacing:0.08em; }

  .body-area{
    padding:0 24px 26px;
    margin-top:-14px;
    position:relative;
    z-index:2;
    text-align:center;
  }

  .photo{
    width:92px; height:92px; border-radius:50%;
    margin:0 auto 14px;
    background:linear-gradient(135deg,#dfe7e2,#c9d6cf);
    border:4px solid var(--paper);
    box-shadow:0 6px 16px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center;
    color:var(--mid); font-size:34px; font-weight:700;
    font-family:'Noto Serif TC', serif;
  }

  .name{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:0.04em;
    margin:0 0 4px;
  }
  .subrole{ font-size:12.5px; color:#4b6763; margin-bottom:16px; }

  .status{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 14px;
    border-radius:999px;
    font-size:12px; font-weight:700; letter-spacing:0.06em;
    background:rgba(43,110,104,0.12);
    color:var(--deep);
    border:1px solid rgba(43,110,104,0.3);
    margin-bottom:20px;
  }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:#3d9c73; animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .divider{ height:1px; background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px); margin:0 0 18px; }

  .info-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:14px 10px;
    text-align:left;
    margin-bottom:20px;
  }
  .info-grid div label{
    display:block; font-size:10.5px; color:#6b8480; letter-spacing:0.1em; margin-bottom:3px;
  }
  .info-grid div span{ font-size:14px; font-weight:700; font-family:'JetBrains Mono', monospace; color:var(--ink); }

  /* --- Live verification strip (anti-screenshot signature element) --- */
  .verify{
    background:var(--ink);
    border-radius:14px;
    padding:14px 16px;
    position:relative;
    overflow:hidden;
  }
  .verify-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .verify-label{ font-size:9.5px; letter-spacing:0.18em; color:rgba(246,243,236,0.55); }
  .verify-clock{ font-size:11px; font-family:'JetBrains Mono', monospace; color:var(--gold); letter-spacing:0.03em; }
  .verify-code{
    font-family:'JetBrains Mono', monospace;
    font-size:26px; font-weight:700; letter-spacing:0.18em;
    color:#F6F3EC;
    margin-bottom:8px;
  }
  .ecg{ width:100%; height:26px; display:block; }
  .ecg path{
    fill:none; stroke:var(--gold); stroke-width:2;
    stroke-dasharray:340; stroke-dashoffset:340;
    animation:draw 2.4s linear infinite;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .foot{
    text-align:center; padding:16px 0 4px;
    font-size:10.5px; color:rgba(246,243,236,0.5);
    letter-spacing:0.05em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand"><b>亞東科技大學</b> 護理系友會・電子會員證</div>

  <div class="card">
    <div class="punch"></div>
    <div class="head">
      <div class="assoc">FAR EASTERN UNIVERSITY NURSING ALUMNI</div>
      <div class="title-row">
        <div class="cross"></div>
        <div class="role">系友會 Membership</div>
      </div>
    </div>

    <div class="body-area">
      <div class="photo">陳</div>
      <div class="name">陳○○</div>
      <div class="subrole">第 12 屆・急診護理組</div>

      <div class="status"><span class="dot"></span>有效會員 ACTIVE</div>

      <div class="divider"></div>

      <div class="info-grid">
        <div><label>會員編號</label><span>FEU-A0142</span></div>
        <div><label>入會年度</label><span>2023</span></div>
        <div><label>會籍效期</label><span>2026.12.31</span></div>
        <div><label>身份別</label><span>正式會員</span></div>
      </div>

      <div class="verify">
        <div class="verify-top">
          <span class="verify-label">LIVE VERIFICATION · 即時驗證</span>
          <span class="verify-clock" id="clock">--:--:--</span>
        </div>
        <div class="verify-code" id="code">••••••</div>
        <svg class="ecg" viewBox="0 0 340 26" preserveAspectRatio="none">
          <path d="M0,13 L60,13 L75,13 L85,2 L95,24 L105,13 L120,13 L340,13" />
        </svg>
      </div>
    </div>

    <div class="foot">請商家目視核對照片、姓名與跳動驗證碼</div>
  </div>
</div>

<script>
  function genCode(){
    // 以時間區間種子產生6碼動態碼，示意用（正式版由後端GAS依會員編號+時間戳雜湊產生）
    const seed = Math.floor(Date.now()/5000);
    let x = seed;
    x = (x ^ (x << 13)) >>> 0; x = (x ^ (x >> 17)) >>> 0; x = (x ^ (x << 5)) >>> 0;
    const code = String(x % 1000000).padStart(6,'0');
    return code.slice(0,3) + ' ' + code.slice(3);
  }
  function tick(){
    document.getElementById('code').textContent = genCode();
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('zh-TW', { hour12:false });
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
